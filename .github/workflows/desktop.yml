name: Build desktop (.deb)

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'tools/desktop-screenshot.sh'
      - 'tools/desktop-appimage.sh'
      - 'core/**'
      - 'desktop-smart/**'
      - 'app/src/smart/assets/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

# Só leitura por padrão: o build roda código do branch (inclusive em PRs). Quem escreve no
# repositório é só o job "capturas", e só fora de PRs (auditoria SUP-03).
permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Gerar o pacote .deb
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot dpkg-dev
          ./gradlew -Psonivell.desktop=only :desktop:packageDeb 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong|Execution failed|error:|Error:" -A3 build.log | head -n 60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Incluir o ffmpeg (e a ponte de som) como dependências do pacote
        shell: bash
        run: |
          set -uo pipefail
          deb=$(find desktop/build -name "*.deb" | head -n 1)
          [ -n "$deb" ] || { echo "::error::nenhum .deb encontrado"; exit 1; }
          work=$(mktemp -d)
          {
            dpkg-deb -R "$deb" "$work/pkg" &&
            control="$work/pkg/DEBIAN/control" &&
            cat "$control" &&
            { if grep -q '^Depends:' "$control"; then sed -i 's/^Depends:\(.*\)$/Depends:\1, ffmpeg/' "$control"; else echo 'Depends: ffmpeg' >> "$control"; fi; } &&
            { grep -q '^Recommends:' "$control" || sed -i '/^Depends:/a Recommends: pipewire-alsa | libasound2-plugins' "$control"; } &&
            chmod 0755 "$work/pkg/DEBIAN" &&
            fakeroot dpkg-deb --root-owner-group -b "$work/pkg" "$work/out.deb" &&
            cp "$work/out.deb" "$deb" &&
            dpkg-deb -I "$deb" &&
            echo "NOTICE Depends: $(dpkg-deb -f "$deb" Depends) | Recommends: $(dpkg-deb -f "$deb" Recommends)" &&
            mkdir -p dist && cp "$deb" dist/
          } > "$work/log.txt" 2>&1 || {
            tail -n 25 "$work/log.txt" | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
          cat "$work/log.txt"
          grep '^NOTICE' "$work/log.txt" | while IFS= read -r line; do echo "::notice::${line}"; done

      - name: Gerar o AppImage
        shell: bash
        run: |
          set -o pipefail
          tools/desktop-appimage.sh 2>&1 | tee appimage.log || {
            tail -n 30 appimage.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
          mkdir -p dist && cp desktop/build/appimage/*.AppImage dist/
          echo "::notice::$(tail -n 1 appimage.log)"

      - name: Captura de tela (ambiente gráfico virtual)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p screenshots
          {
            set -x
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xdotool imagemagick ffmpeg x11-utils
            sudo mkdir -p /usr/share/applications /usr/share/desktop-directories /etc/xdg/menus/applications-merged /usr/share/mime/packages
            sudo dpkg -i dist/*.deb || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -f -y -qq
            ls -la /opt/sonivell/bin/
            bash tools/desktop-screenshot.sh "$GITHUB_WORKSPACE/screenshots"
          } > screenshots/ci.log 2>&1
          echo "rc=$?" >> screenshots/ci.log

      - name: Testes do módulo desktop (inclui o SMART de ponta a ponta)
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p screenshots
          set +e
          ./gradlew -Psonivell.desktop=only :desktop:test -i > test-full.log 2>&1
          rc=$?
          { echo "rc=$rc"; grep -E "SMART|FAILED|PASSED|AssertionError|Exception|error:|e: " test-full.log | head -n 80; echo ----; tail -n 40 test-full.log; } > screenshots/test.log
          exit $rc

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonivell-desktop-deb
          path: dist/*.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonivell-desktop-appimage
          path: dist/*.AppImage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: sonivell-desktop-screenshots
          path: screenshots/
          if-no-files-found: ignore

  capturas:
    # Publica as capturas na branch desktop-screenshots. Separado do build para só este job ter
    # permissão de escrita, e só em push para a main ou execução manual (nunca em PRs).
    needs: deb
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write # push -f da branch desktop-screenshots
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sonivell-desktop-screenshots
          path: screenshots

      - name: Publicar as capturas na branch desktop-screenshots
        shell: bash
        run: |
          set -euo pipefail
          [ -d screenshots ] || exit 0
          dir=$(mktemp -d)
          cp screenshots/* "$dir"/
          cd "$dir"
          git init -q -b desktop-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas do Sonivell para PC"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" desktop-screenshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
