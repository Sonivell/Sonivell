name: Build desktop (.deb)

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar o pacote .deb
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot dpkg-dev
          ./gradlew -Psonivell.desktop=true :desktop:packageDeb 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong|Execution failed|error:|Error:" -A3 build.log | head -n 60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Incluir o ffmpeg como dependência do pacote
        shell: bash
        run: |
          set -uo pipefail
          deb=$(find desktop/build -name "*.deb" | head -n 1)
          [ -n "$deb" ] || { echo "::error::nenhum .deb encontrado"; exit 1; }
          work=$(mktemp -d)
          {
            dpkg-deb -R "$deb" "$work/pkg" &&
            control="$work/pkg/DEBIAN/control" &&
            cat "$control" &&
            { if grep -q '^Depends:' "$control"; then sed -i 's/^Depends:\(.*\)$/Depends:\1, ffmpeg/' "$control"; else echo 'Depends: ffmpeg' >> "$control"; fi; } &&
            chmod 0755 "$work/pkg/DEBIAN" &&
            fakeroot dpkg-deb --root-owner-group -b "$work/pkg" "$work/out.deb" &&
            cp "$work/out.deb" "$deb" &&
            dpkg-deb -I "$deb" &&
            echo "NOTICE $(dpkg-deb -f "$deb" Depends)" &&
            mkdir -p dist && cp "$deb" dist/
          } > "$work/log.txt" 2>&1 || {
            tail -n 25 "$work/log.txt" | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
          cat "$work/log.txt"
          grep '^NOTICE' "$work/log.txt" | while IFS= read -r line; do echo "::notice::${line}"; done

      - name: Captura de tela (ambiente gráfico virtual)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          log=$(mktemp)
          stage() { echo "::notice::etapa: $1"; }
          fail() { tail -n 25 "$log" | grep -v '^$' | while IFS= read -r line; do echo "::error::${1}: ${line}"; done; exit 1; }
          stage "apt update";  sudo apt-get update -qq > "$log" 2>&1 || fail "apt update"
          stage "apt ferramentas"; sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xdotool imagemagick ffmpeg x11-utils > "$log" 2>&1 || fail "apt ferramentas"
          stage "instalar deb"; sudo dpkg -i dist/*.deb > "$log" 2>&1; echo "dpkg rc=$?" >> "$log"; sudo DEBIAN_FRONTEND=noninteractive apt-get install -f -y >> "$log" 2>&1; echo "apt -f rc=$?" >> "$log"; grep -E "rc=|rror|aviso|warning" "$log" | while IFS= read -r line; do echo "::notice::inst: ${line}"; done; [ -x /opt/sonivell/bin/sonivell ] || fail "instalar deb"
          ls -la /opt/sonivell/bin/ 2>&1 | while IFS= read -r line; do echo "::notice::${line}"; done
          stage "capturas"; bash tools/desktop-screenshot.sh "$GITHUB_WORKSPACE/screenshots" > "$log" 2>&1 || fail "capturas"
          tail -n 12 "$log" | grep -v '^$' | while IFS= read -r line; do echo "::notice::${line}"; done

      - name: Publicar as capturas na branch desktop-screenshots
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          [ -d screenshots ] || exit 0
          dir=$(mktemp -d)
          cp screenshots/* "$dir"/
          cd "$dir"
          git init -q -b desktop-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas do Sonivell para PC"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" desktop-screenshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Testes do módulo desktop
        shell: bash
        run: ./gradlew -Psonivell.desktop=true :desktop:test 2>&1 | tail -n 40

      - uses: actions/upload-artifact@v4
        with:
          name: sonivell-desktop-deb
          path: dist/*.deb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonivell-desktop-screenshots
          path: screenshots/
          if-no-files-found: ignore
