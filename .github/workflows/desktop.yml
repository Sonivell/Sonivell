name: Build desktop (.deb)

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'core/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar o pacote .deb
        shell: bash
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot dpkg-dev
          ./gradlew -Psonivell.desktop=true :desktop:packageDeb 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong|Execution failed|error:|Error:" -A3 build.log | head -n 60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Incluir o ffmpeg como dependência do pacote
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls desktop/build/compose/binaries/main/deb/*.deb | head -n 1)
          work=$(mktemp -d)
          dpkg-deb -R "$deb" "$work/pkg"
          control="$work/pkg/DEBIAN/control"
          if grep -q '^Depends:' "$control"; then
            sed -i 's/^Depends:\(.*\)$/Depends:\1, ffmpeg/' "$control"
          else
            echo 'Depends: ffmpeg' >> "$control"
          fi
          fakeroot dpkg-deb -b "$work/pkg" "$deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | head -n 30
          mkdir -p dist && cp "$deb" dist/

      - name: Captura de tela (ambiente gráfico virtual)
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get install -y -qq xvfb xdotool imagemagick ffmpeg x11-utils
          sudo apt-get install -y -qq ./dist/*.deb
          tools/desktop-screenshot.sh "$GITHUB_WORKSPACE/screenshots"

      - name: Testes do módulo desktop
        shell: bash
        run: ./gradlew -Psonivell.desktop=true :desktop:test 2>&1 | tail -n 40

      - uses: actions/upload-artifact@v4
        with:
          name: sonivell-desktop-deb
          path: dist/*.deb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonivell-desktop-screenshots
          path: screenshots/
          if-no-files-found: ignore
