name: SMART no PC (teste rápido)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop-smart/**'
      - 'desktop/src/main/kotlin/com/juscelino/sonivell/desktop/Smart.kt'
      - 'desktop/src/test/**'
      - '.github/workflows/smart-test.yml'

permissions:
  contents: write

jobs:
  smart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Diagnóstico do SMART (ffmpeg + ONNX Runtime)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg cmake g++ >/dev/null
          mkdir -p out
          { nproc; grep -m1 'model name' /proc/cpuinfo; grep -m1 flags /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512f|ssse3|sse4_1|fma|avx_vnni)$' | tr '\n' ' '; echo; } > out/cpu.log
          # 1) Os testes do próprio operador (aritmética em todos os caminhos que a CPU tem)
          cmake -S core/ort-ops/src/main/cpp -B /tmp/ljq4-host -DCMAKE_BUILD_TYPE=Release -DLJQ4_TESTS=ON > out/host-cmake.log 2>&1
          cmake --build /tmp/ljq4-host -j >> out/host-cmake.log 2>&1
          for t in ljq4_test ljdots_test; do echo "== $t"; /tmp/ljq4-host/$t 2>&1 | tail -n 15; echo "rc=$?"; done > out/host-tests.log 2>&1
          # 2) O modelo uma vez, em variantes de sessão (cada uma num processo, pois o erro derruba a JVM)
          set +e
          for v in default arena noopt nopattern threads; do
            export SONIVELL_ORT_VARIANT=$v SONIVELL_SMART_TRACE="$PWD/out/trace-$v.log"
            ./gradlew -Psonivell.desktop=only :desktop:cleanTest :desktop:test --tests '*OrtSmokeTest*' -i > out/smoke-$v-full.log 2>&1
            echo "variant=$v rc=$?" >> out/smoke.log
            grep -E "SMOKE|SIGSEGV|Problematic|C  \[" out/smoke-$v-full.log | head -n 6 >> out/smoke.log
            rm -f out/smoke-$v-full.log; find . -name 'hs_err_pid*.log' -delete
          done
          # 3) O teste completo (decodifica, analisa, monta a fila), só com a variante padrão
          unset SONIVELL_ORT_VARIANT; export SONIVELL_SMART_TRACE="$PWD/out/trace-full.log"
          ./gradlew -Psonivell.desktop=only :desktop:cleanTest :desktop:test --tests '*SmartEngineTest*' -i > out/test-full.log 2>&1
          echo "full rc=$?" > out/test.log
          grep -E "SMART|FAILED|PASSED|SKIPPED|AssertionError|Exception|e: |SIGSEGV|Problematic" out/test-full.log | head -n 60 >> out/test.log
      - name: Publicar o log na branch smart-logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          [ -d out ] || exit 0
          dir=$(mktemp -d); cp out/* "$dir"/ 2>/dev/null || true; cd "$dir"
          git init -q -b smart-logs; git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add -A; git commit -q -m "Logs do teste do SMART"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" smart-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
