name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APKs de release (lite e SMART)
        run: ./gradlew assembleLiteRelease assembleSmartRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sonivell-lite-apk
          path: app/build/outputs/apk/lite/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonivell-smart-apk
          path: app/build/outputs/apk/smart/release/*.apk
