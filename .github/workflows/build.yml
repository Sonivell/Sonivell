name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Só leitura: este workflow compila e publica artefatos, não escreve no repositório.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A chave de release fica nos secrets do environment "release": só este job os recebe, e as
    # regras de proteção do environment (Settings > Environments) decidem quais branches podem usá-la.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      # Testes unitários do app (JVM): backup, gravações, busca. Rodam antes de empacotar.
      - name: Testes unitários do app
        run: ./gradlew :app:testLiteDebugUnitTest

      # Chave de release: só pelos secrets (não há chave de teste no repositório). Sem ela, o build falha,
      # exceto em PR de fork, onde o GitHub não entrega os secrets: aí só os APKs de debug são compilados.
      - name: Chave de assinatura
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SONIVELL_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SONIVELL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SONIVELL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PR_DE_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: tools/ci/apk-chave.sh

      - name: Compilar APKs (lite e SMART)
        shell: bash
        env:
          SONIVELL_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SONIVELL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SONIVELL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: tools/ci/apk-compilar.sh

      # Prova de que os APKs saíram com a SUA chave: imprime o SHA-256 do certificado e reprova se for
      # a antiga chave de teste (pública) ou se a assinatura não validar.
      - name: Conferir a assinatura dos APKs
        if: env.SONIVELL_BUILD == 'release'
        shell: bash
        run: tools/ci/apk-conferir.sh

      - name: Apagar a chave do disco
        if: always()
        run: rm -f "$RUNNER_TEMP/sonivell-release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonivell-lite-apk
          path: app/build/outputs/apk/lite/*/*.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonivell-smart-apk
          path: app/build/outputs/apk/smart/*/*.apk
