name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar APKs de release (lite e SMART)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleLiteRelease assembleSmartRelease 2>&1 | tee build.log || {
            # Em caso de erro, destaca as mensagens como anotações (visíveis no resumo da execução).
            grep -E "^e: |What went wrong|Execution failed|error:|Error:|Lint found" -A3 build.log | head -n 60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: sonivell-lite-apk
          path: app/build/outputs/apk/lite/release/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: sonivell-smart-apk
          path: app/build/outputs/apk/smart/release/*.apk
