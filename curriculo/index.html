<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Currículo</title>
  <meta name="description" content="Crie currículos offline, com privacidade total, e exporte em PDF, PDF para ATS, Word, texto e mais.">
  <meta name="theme-color" content="#1c1f24">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/resume.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-view="loading">

  <!-- Início: lista de currículos -->
  <section id="view-home" class="view">
    <header class="home-top">
      <div class="brand"><img src="icons/icon.svg" alt="" width="36" height="36"><span data-app-name>Currículo</span></div>
      <button type="button" class="btn ghost small" id="btn-backup-all" title="Baixar todos os currículos num arquivo">Backup</button>
    </header>
    <div class="home-hero">
      <h1>Seus currículos</h1>
      <p>Offline, privado e de código aberto. Nada sai do seu aparelho.</p>
      <div class="hero-actions">
        <button type="button" class="btn primary" id="btn-new">Novo currículo</button>
        <button type="button" class="btn ghost" id="btn-example">Começar pelo exemplo</button>
        <button type="button" class="btn ghost" id="btn-import">Importar</button>
      </div>
    </div>
    <div id="resume-list" class="resume-list"></div>
  </section>

  <!-- Editor + visualização -->
  <section id="view-editor" class="view">
    <header class="topbar">
      <button type="button" class="icon-btn outline" id="btn-back" aria-label="Voltar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="topbar-title">
        <button type="button" id="doc-title" title="Renomear">Currículo</button>
        <span id="save-status" class="save-status" aria-live="polite"></span>
      </div>
      <button type="button" class="icon-btn outline" id="btn-ats" title="Análise ATS" aria-label="Análise ATS">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 12v.01"/></svg>
      </button>
      <button type="button" class="icon-btn outline hide-previewing" id="btn-doc-menu" aria-label="Mais opções">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v.01M12 12v.01M12 18.5v.01"/></svg>
      </button>
      <button type="button" class="icon-btn accent" id="btn-download" aria-label="Baixar" title="Baixar">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      </button>
    </header>

    <div class="workspace">
      <div class="editor-pane scroll" id="editor"></div>

      <div class="preview-pane">
        <div class="preview-scroll scroll" id="preview-scroll">
          <div class="page-wrap" id="page-wrap"><div id="page"></div></div>
          <div class="page-count" id="page-count"></div>
        </div>
        <div class="style-dock">
          <div class="style-panel" id="style-panel"></div>
          <nav class="style-tabs" aria-label="Aparência">
            <button type="button" data-tab="templates" title="Modelos" aria-label="Modelos"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
            <button type="button" data-tab="font" title="Fonte" aria-label="Fonte"><svg class="ico" viewBox="0 0 24 24"><path d="M3 19l5-14 5 14M5 14h6M15 19v-5a3 3 0 0 1 6 0v5M21 15.5c-1.5-1-6-1-6 1.5s4 2 6 0"/></svg></button>
            <button type="button" data-tab="spacing" title="Espaçamento" aria-label="Espaçamento"><svg class="ico" viewBox="0 0 24 24"><path d="M4 6h10M4 12h10M4 18h10M19 4v16M17 6l2-2 2 2M17 18l2 2 2-2"/></svg></button>
            <button type="button" data-tab="layout" title="Layout" aria-label="Layout"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM10 4v16"/></svg></button>
            <button type="button" data-tab="color" title="Cor" aria-label="Cor"><svg class="ico" viewBox="0 0 24 24"><path d="M5 13l7-8 7 8-7 7zM5 13h14M20 17s1.5 2 1.5 3a1.5 1.5 0 0 1-3 0c0-1 1.5-3 1.5-3"/></svg></button>
          </nav>
        </div>
      </div>
    </div>

    <button type="button" class="fab" id="btn-preview-fab" aria-label="Visualização">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M14 3v5h5V11M16.5 13a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM19 19.5l2 2"/></svg>
    </button>
  </section>

  <!-- Usado só na hora de imprimir/salvar PDF -->
  <div id="print-root"></div>

  <noscript><p style="padding:24px">Este app precisa de JavaScript ativado.</p></noscript>
</body>
</html>
