<!-- Ícone "Onda" (variante Grafite, cartões de vidro) do Sonivell. Referência vetorial: os PNGs
     (desktop/packaging/sonivell.png, desktop/src/main/resources/icon.png e os mipmaps do Android)
     são gerados por tools/gen_app_icons.py, que também calcula o desfoque do vidro. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fundo" x1="0.33" y1="0" x2="0.67" y2="1">
      <stop offset="0" stop-color="#23272A"/>
      <stop offset="0.5" stop-color="#15181A"/>
      <stop offset="1" stop-color="#0B0D0E"/>
    </linearGradient>
    <linearGradient id="reflexo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="icone"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#icone)" transform="translate(12.8 12.8) scale(0.95)">
    <rect width="512" height="512" fill="url(#fundo)"/>
    <ellipse cx="256" cy="40" rx="336" ry="180" fill="#CDEB4F" fill-opacity="0.10"/>
    <rect x="138" y="96" width="236" height="260" rx="64" fill="#A9C243" fill-opacity="0.85" stroke="#EBFAAA" stroke-opacity="0.55" stroke-width="1.5" filter="url(#sombra)"/>
    <g filter="url(#sombra)">
      <rect x="112" y="128" width="288" height="288" rx="76" fill="#2A2E2A" fill-opacity="0.92"/>
    </g>
    <rect x="112" y="128" width="288" height="288" rx="76" fill="url(#reflexo)" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.5"/>
    <path d="M182,278C202,222 234,222 256,272C278,322 310,322 330,266" fill="none" stroke="#D4EF55" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
